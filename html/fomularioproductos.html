<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizar información cliente</title>
</head>
<body>
    <h1>Visualizar información cliente</h1>
    <form>
        <label for="nombre">ID del cliente:</label>
        <input type="text" id="nameUser" name="nombre" required><br><br>

        <label for="email">Nombre del cliente:</label>
        <input type="email" id="correo" name="correo" required><br><br>

        <label for="contraseña">Teléfono del cliente:</label>
        <input type="password" id="contraseña" name="contraseña" required><br><br>
        <label for="condirmContrasena">Correo del cliente:</label>
        <input type="password" id="confirmContrasena" required><br><br>

        <button type="submit">Buscar</button>
        <button type="submit">Cancelar</button>
    </form>
    </body>
</html>
