<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar información del artículo</title>
</head>
<body>
    <h1>Eliminar información del artículo</h1>
    <form>
        <label for="nombre">ID del artículo a eliminar:</label>
        <input type="text" id="nameUser" name="nombre" required><br><br>

        <label for="email">Nombre del artículo:</label>
        <input type="email" id="correo" name="correo" required><br><br>

        <label for="contraseña">Precio del artículo:</label>
        <input type="password" id="contraseña" name="contraseña" required><br><br>
        <label for="condirmContrasena">Cantidad del artículo:</label>
        <input type="password" id="confirmContrasena" required><br><br>

        <button type="submit">Eliminar</button>
        <button type="submit">Cancelar</button>
    </form>
</html>
